<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="128%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#0f172a">Turium Knowledge Hub — Overview</text>

  <!-- Frontend -->
  <g filter="url(#sh)"><rect x="330" y="60" width="240" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text x="450" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Frontend</text>
  <text x="450" y="103" text-anchor="middle" font-size="11.5" fill="#64748b">Save notes &amp; URLs · Ask and get cited answers</text>

  <line x1="450" y1="118" x2="450" y2="156" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="462" y="141" font-size="11" fill="#64748b">HTTP · /api (JSON)</text>

  <!-- Backend -->
  <g filter="url(#sh)"><rect x="70" y="158" width="760" height="212" rx="12" fill="#ffffff" stroke="#cbd5e1"/></g>
  <rect x="70" y="158" width="760" height="30" rx="12" fill="url(#brand)"/>
  <rect x="70" y="176" width="760" height="12" fill="url(#brand)"/>
  <text x="86" y="179" font-size="13" font-weight="700" fill="#ffffff">FastAPI backend</text>
  <text x="814" y="179" text-anchor="end" font-size="11" fill="#e9d5ff">structured JSON logs · per-request trace</text>

  <!-- Ingest flow -->
  <text x="90" y="222" font-size="12" font-weight="700" fill="#4f46e5">Ingest</text>
  <g font-size="11.5" fill="#0f172a" text-anchor="middle">
    <g filter="url(#sh)"><rect x="152" y="206" width="150" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
    <text x="227" y="227">Fetch + extract <tspan fill="#94a3b8">(URL)</tspan></text>
    <g filter="url(#sh)"><rect x="338" y="206" width="110" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
    <text x="393" y="227">Chunk</text>
    <g filter="url(#sh)"><rect x="484" y="206" width="110" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
    <text x="539" y="227">Embed</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)">
    <line x1="302" y1="223" x2="336" y2="223"/><line x1="448" y1="223" x2="482" y2="223"/>
  </g>

  <!-- Query flow -->
  <text x="90" y="304" font-size="12" font-weight="700" fill="#7c3aed">Query</text>
  <g font-size="11.5" fill="#0f172a" text-anchor="middle">
    <g filter="url(#sh)"><rect x="152" y="288" width="96" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
    <text x="200" y="309">Embed</text>
    <g filter="url(#sh)"><rect x="272" y="288" width="120" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
    <text x="332" y="309">Vector search</text>
    <g filter="url(#sh)"><rect x="416" y="288" width="130" height="34" rx="8" fill="#f8fafc" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3"/></g>
    <text x="481" y="305">Relevance gate</text>
    <text x="481" y="317" font-size="9" fill="#94a3b8">optional</text>
    <g filter="url(#sh)"><rect x="570" y="288" width="150" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
    <text x="645" y="309">Generate answer</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)">
    <line x1="248" y1="305" x2="270" y2="305"/><line x1="392" y1="305" x2="414" y2="305"/><line x1="546" y1="305" x2="568" y2="305"/>
  </g>

  <!-- Backend -> stores arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path d="M200 370 L200 414"/>
    <path d="M450 370 L450 414"/>
    <path d="M705 370 L705 414"/>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="200" y="393">persist</text><text x="450" y="393">search</text><text x="705" y="393">embeddings + chat</text>
  </g>

  <!-- Stores row -->
  <!-- SQLite cylinder -->
  <g filter="url(#sh)">
    <path d="M120 430 a80 11 0 0 1 160 0 l0 44 a80 11 0 0 1 -160 0 Z" fill="#ffffff" stroke="#cbd5e1"/>
    <ellipse cx="200" cy="430" rx="80" ry="11" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="200" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SQLite</text>

  <g filter="url(#sh)"><rect x="360" y="422" width="180" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text x="450" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Vector index</text>

  <g filter="url(#sh)"><rect x="600" y="422" width="210" height="66" rx="10" fill="#ecfeff" stroke="#67e8f9"/></g>
  <text x="705" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">AI provider</text>
  <text x="705" y="470" text-anchor="middle" font-size="10.5" fill="#0369a1">Ollama (local)</text>
</svg>
